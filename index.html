<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: Arial, sans-serif;
}

/* شكل القلب */
.heart {
  position: relative;
  width: 200px;
  height: 180px;
  background-color: red;
  transform: rotate(-45deg);
  animation: pulse 1.5s infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 180px;
  background-color: red;
  border-radius: 50%;
}

.heart::before {
  top: -100px;
  left: 0;
}

.heart::after {
  left: 100px;
  top: 0;
}

/* النص داخل القلب */
.text {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  color: white;
  font-size: 18px;
  font-weight: bold;
}

/* حركة نبض */
@keyframes pulse {
  0% { transform: rotate(-45deg) scale(1); }
  50% { transform: rotate(-45deg) scale(1.1); }
  100% { transform: rotate(-45deg) scale(1); }
}
</style>
</head>

<body>

<div class="heart">
  <div class="text">
    peshang <br> + <br> aro <br> + <br> mubin
  </div>
</div>

</body>
</html>
